name: rcuc-dev
services:
  vault:
    image: hashicorp/vault
    container_name: vault-new
    environment:
      VAULT_ADDR: "http://vault1.poc.thecloudgarage.com:8200"
      VAULT_API_ADDR: "http://vault1.poc.thecloudgarage.com:8200"
      VAULT_ADDRESS: "http://vault1.poc.thecloudgarage.com:8200"
    ports:
      - "8200:8200"
      - "8201:8201"
    restart: always
    volumes:
      - ./infra/volumes/vault/logs:/vault/logs/:rw
      - ./infra/volumes/vault/data:/vault/data/:rw
      - ./vault/config:/vault/config/:rw
      - ./infra/volumes/vault/certs:/certs/:rw
      - ./infra/volumes/vault/file:/vault/file/:rw
    cap_add:
      - IPC_LOCK
    entrypoint: vault server -config /vault/config/config.hcl
  app:
    container_name: rcuc-dev-app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    volumes:
      - ./src:/usr/src/app/src
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(process.env.PORT||3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\" "]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
