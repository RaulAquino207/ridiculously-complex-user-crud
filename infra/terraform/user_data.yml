#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg

write_files:
  - path: /opt/app/docker-compose.yml
    permissions: '0644'
    encoding: b64
    content: ${COMPOSE_B64}

runcmd:
  - [ bash, -lc, 'install -m 0755 -d /etc/apt/keyrings' ]
  - [ bash, -lc, 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg' ]
  - [ bash, -lc, 'chmod a+r /etc/apt/keyrings/docker.gpg' ]
  - [ bash, -lc, 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list' ]
  - [ bash, -lc, 'apt-get update -y' ]
  - [ bash, -lc, 'apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin' ]
  - [ bash, -lc, 'usermod -aG docker ubuntu || true' ]
  - [ bash, -lc, 'systemctl enable docker && systemctl start docker' ]
  - [ bash, -lc, 'cd /opt/app && docker compose pull && docker compose up -d' ]
  - |
    bash -lc 'cat >/etc/systemd/system/app-compose.service <<EOF
    [Unit]
    Description=Docker Compose App ${APP_NAME}
    After=docker.service
    Requires=docker.service

    [Service]
    Type=oneshot
    WorkingDirectory=/opt/app
    ExecStart=/usr/bin/docker compose up -d
    ExecStop=/usr/bin/docker compose down
    RemainAfterExit=yes
    TimeoutStartSec=0

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable app-compose.service
    systemctl start app-compose.service'
